<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貨幣匯率轉換</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        input, select, button {
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #result {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }
    </style>
    <script>
        async function getExchangeRate(baseCurrency, targetCurrency) {
            try {
                let response = await fetch(`https://api.exchangerate-api.com/v4/latest/${baseCurrency}`);
                let data = await response.json();
                return data.rates[targetCurrency];
            } catch (error) {
                console.error('獲取匯率失敗', error);
                return null;
            }
        }

        async function convertCurrency() {
            let amount = document.getElementById("amount").value;
            let baseCurrency = document.getElementById("baseCurrency").value;
            let targetCurrency = document.getElementById("targetCurrency").value;
            let rate = await getExchangeRate(baseCurrency, targetCurrency);
            
            if (rate) {
                let convertedAmount = amount * rate;
                document.getElementById("result").innerText = `換算結果：${convertedAmount.toFixed(2)} ${targetCurrency} (匯率：${rate.toFixed(4)})`;
            } else {
                document.getElementById("result").innerText = "無法獲取最新匯率，請稍後再試。";
            }
        }

        function swapCurrencies() {
            let baseCurrency = document.getElementById("baseCurrency");
            let targetCurrency = document.getElementById("targetCurrency");
            let temp = baseCurrency.value;
            baseCurrency.value = targetCurrency.value;
            targetCurrency.value = temp;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>貨幣匯率轉換</h1>
        <p>請輸入金額並選擇來源與目標貨幣</p>
        <label for="amount">輸入金額：</label>
        <input type="number" id="amount" placeholder="輸入金額">
        <br>
        <label for="baseCurrency">來源貨幣：</label>
        <select id="baseCurrency">
            <option value="JPY">日圓 (JPY)</option>
            <option value="USD">美元 (USD)</option>
            <option value="EUR">歐元 (EUR)</option>
            <option value="TWD">台幣 (TWD)</option>
        </select>
        <br>
        <label for="targetCurrency">目標貨幣：</label>
        <select id="targetCurrency">
            <option value="TWD">台幣 (TWD)</option>
            <option value="JPY">日圓 (JPY)</option>
            <option value="USD">美元 (USD)</option>
            <option value="EUR">歐元 (EUR)</option>
        </select>
        <br>
        <button onclick="convertCurrency()">換算</button>
        <button onclick="swapCurrencies()">⇄ 對調貨幣</button>
        <p id="result"></p>
    </div>
</body>
</html>
